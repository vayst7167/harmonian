<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>하모니아 인식법</title>
<style>
/* Layout: 한 열 앱. 홈(프리즘+네 걸음) → 설정 → 분광 7화면 → 순서 1화면 → 결과(멈춤·분광·순서·화음). 일곱 색은 프리즘의 일곱 갈래, 가운데는 비워 둔 바깥의 자리. */
:root {
  --bg: #f4f5f8;
  --surface: #ffffff;
  --fg: #1b2132;
  --muted: #5a6479;
  --line: #d8dce6;
  --accent: #2a3868;
  --accent-soft: #e3e7f4;
  --c1: #c2503f; --c2: #c9822b; --c3: #a89a1f; --c4: #3f8f5a; --c5: #2f84a8; --c6: #4a56b8; --c7: #8a4aa8;
  --font-display: "Nanum Myeongjo", "Noto Serif KR", "AppleMyungjo", "Batang", serif;
  --font-body: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11141c; --surface: #191e2a; --fg: #e8ebf2; --muted: #9aa3b6; --line: #2c3344;
    --accent: #a2b2f0; --accent-soft: #222a45;
    --c1: #e37a68; --c2: #e0a04e; --c3: #ccbd4a; --c4: #62b57f; --c5: #5fb0d4; --c6: #7f8bf0; --c7: #bd82d8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11141c; --surface: #191e2a; --fg: #e8ebf2; --muted: #9aa3b6; --line: #2c3344;
  --accent: #a2b2f0; --accent-soft: #222a45;
  --c1: #e37a68; --c2: #e0a04e; --c3: #ccbd4a; --c4: #62b57f; --c5: #5fb0d4; --c6: #7f8bf0; --c7: #bd82d8;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); line-height: 1.75; padding-inline: 16px; padding-block: 28px 64px; }
#app { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.35; }
h1 { font-size: 2rem; font-weight: 800; }
h2 { font-size: 1.3rem; }
h3 { font-size: 1.05rem; }
p { margin: 0; }
.lede { color: var(--muted); max-width: 36em; }
.kicker { font-size: 0.74rem; letter-spacing: 0.16em; color: var(--muted); text-transform: uppercase; }
.hero { display: flex; flex-direction: column; gap: 14px; }
.prism svg { display: block; width: 100%; max-width: 440px; height: auto; }
.steps ol { list-style: none; counter-reset: s; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 2.4rem 4.2rem 1fr; gap: 6px; align-items: baseline; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.steps li::before { content: counter(s); font-family: var(--font-display); font-size: 1.4rem; color: var(--accent); }
.steps li b { font-family: var(--font-display); font-size: 1.1rem; }
.steps li span { color: var(--muted); font-size: 0.92rem; min-width: 0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
button { font: inherit; font-weight: 500; cursor: pointer; padding: 11px 20px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: var(--bg); min-height: 44px; }
button.ghost { background: transparent; color: var(--accent); border-color: var(--line); }
button.small { padding: 6px 12px; min-height: 36px; font-size: 0.85rem; }
button:disabled { opacity: 0.45; cursor: not-allowed; }
button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type=text], textarea { width: 100%; font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 11px 13px; }
textarea { min-height: 110px; resize: vertical; line-height: 1.7; }
label.f { display: flex; flex-direction: column; gap: 6px; font-weight: 500; font-size: 0.95rem; }
.panel { display: flex; flex-direction: column; gap: 18px; }
.hint { font-size: 0.82rem; color: var(--muted); }
.progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); }
.fhead { display: flex; align-items: center; gap: 10px; }
.dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.tagline { color: var(--muted); font-size: 0.92rem; }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
.item { display: flex; flex-direction: column; gap: 8px; }
.item legend { padding: 0; margin-bottom: 8px; }
.scale, .opts { position: relative; }
.scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.scale input, .opts input { position: absolute; opacity: 0; pointer-events: none; }
.scale label { display: flex; justify-content: center; align-items: center; min-height: 44px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); cursor: pointer; color: var(--muted); font-variant-numeric: tabular-nums; }
.scale input:checked + label { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.ends { display: flex; justify-content: space-between; font-size: 0.74rem; color: var(--muted); }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opts label { display: block; padding: 12px 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); cursor: pointer; }
.opts input:checked + label { border-color: var(--accent); background: var(--accent-soft); }
.scale input:focus-visible + label, .opts input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }
.pcard { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.pcard .q { font-weight: 500; }
.sec { display: flex; flex-direction: column; gap: 14px; }
.sec > h2 { padding-bottom: 8px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 10px; }
.sec > h2 small { font-family: var(--font-body); font-size: 0.74rem; letter-spacing: 0.12em; color: var(--muted); font-weight: 400; }
.recap { font-family: var(--font-display); font-size: 1.12rem; padding-left: 14px; border-left: 3px solid var(--accent); }
.chart { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
.chart svg { display: block; width: 100%; height: auto; max-width: 460px; margin: 0 auto; }
.cap { font-size: 0.8rem; color: var(--muted); text-align: center; margin-top: 4px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.card .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.card h3 { display: flex; align-items: center; gap: 8px; }
.chip { font-size: 0.76rem; padding: 2px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.chip.hi { background: var(--accent); color: var(--bg); }
.bar { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar b { display: block; height: 100%; }
.try { font-size: 0.88rem; color: var(--accent); }
.try::before { content: "해 보기  "; font-size: 0.72rem; letter-spacing: 0.1em; color: var(--muted); }
.pairrows { display: flex; flex-direction: column; gap: 12px; }
.prow { display: grid; grid-template-columns: 3.6rem 1fr; gap: 10px; align-items: center; }
.prow .nm { font-family: var(--font-display); }
.prow .bars { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.prow .bar.b2 { background: transparent; border: 1px dashed var(--muted); height: 7px; }
.prow .bar.b2 b { background: transparent; border-right: 3px solid var(--fg); }
.path { display: flex; flex-direction: column; gap: 10px; list-style: none; padding: 0; margin: 0; counter-reset: p; }
.path li { counter-increment: p; display: grid; grid-template-columns: 2rem 1fr; gap: 8px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.path li::before { content: counter(p); font-family: var(--font-display); font-size: 1.3rem; color: var(--accent); }
.path li b { display: block; }
.path li span { color: var(--muted); font-size: 0.92rem; }
.note { padding: 12px 14px; background: var(--accent-soft); border-radius: 6px; font-size: 0.93rem; }
.hist { display: flex; flex-direction: column; gap: 8px; }
.hrow { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; flex-wrap: wrap; }
.hrow .t { min-width: 0; flex: 1 1 200px; }
.hrow .t b { display: block; overflow-wrap: anywhere; }
details.ai { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
details.ai summary { cursor: pointer; font-weight: 500; }
details.ai .in { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.aiout { white-space: pre-wrap; font-size: 0.95rem; }
footer { font-size: 0.8rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; max-width: 40em; }
@media (max-width: 420px) { .steps li { grid-template-columns: 2rem 3.8rem 1fr; } h1 { font-size: 1.7rem; } }
@media (prefers-reduced-motion: no-preference) { .bar b, .progress i { transition: width 0.5s ease; } }
details.fd { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
details.fd summary { cursor: pointer; font-weight: 500; }
.frows { display: flex; flex-direction: column; gap: 14px; margin-top: 12px; }
.frow { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.fl { display: flex; justify-content: space-between; gap: 10px; }
.mrow { display: grid; grid-template-columns: 5.2rem 1fr 2rem; align-items: center; gap: 8px; font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.mrow .ml { color: var(--muted); }
.mrow .mv { text-align: right; color: var(--muted); }
ul.plain { list-style: none; padding: 0; margin: 0 0 12px; display: flex; flex-direction: column; gap: 6px; }
</style>

<main id="app"><p style="padding:24px 0;line-height:1.7">불러오는 중입니다… 이 글이 계속 보이면 이 앱에서는 검사가 실행되지 않는 것입니다. 파일을 크롬이나 사파리 같은 브라우저로 열어 주세요.</p><noscript><p>자바스크립트가 꺼져 있어 검사를 실행할 수 없습니다. 브라우저 설정에서 켜 주세요.</p></noscript></main>

<script>
(function(){
if(!Element.prototype.replaceChildren){Element.prototype.replaceChildren=function(){while(this.firstChild)this.removeChild(this.firstChild);for(var i=0;i<arguments.length;i++)this.appendChild(typeof arguments[i]==="string"?document.createTextNode(arguments[i]):arguments[i]);};}
if(!Element.prototype.append){Element.prototype.append=function(){for(var i=0;i<arguments.length;i++)this.appendChild(typeof arguments[i]==="string"?document.createTextNode(arguments[i]):arguments[i]);};}
window.addEventListener("error",function(e){var m=document.getElementById("app");if(m&&m.textContent.indexOf("불러오는 중")>=0){m.innerHTML="";var p=document.createElement("p");p.style.padding="24px 0";p.textContent="이 브라우저에서는 검사를 실행하지 못했습니다. 크롬이나 사파리 최신 버전으로 열어 주세요. (오류: "+(e.message||"알 수 없음")+")";m.appendChild(p);}});
})();
</script>
<script>
(function () {
"use strict";

/* ================= 하모니아 고유 구조 =================
   일곱 빛은 각각 두 방향으로 읽습니다.
   활성: 그 빛이 제 몫을 하고 있는가.
   독주: 그 빛이 지나치게 쓰여 다른 빛을 누르고 있는가. (처리구조 단일화의 징후)
   두 값의 조합이 네 모양을 만듭니다: 제 몫(on) · 독주(solo) · 희미(dim) · 헛돎(spin).
   빛마다 움직임 세 가지, 움직임마다 활성 문항 2개와 독주 문항 2개를 둡니다. */
var FUNCS = [
  { key: "관측", nick: "보기", tag: "있는 그대로 보기", c: "var(--c1)",

    solo: "보는 힘은 강한데 ‘내가 본 게 전부’가 되어 있어요. 다른 사람이 본 장면이 들어올 자리가 없습니다. 이 힘을 줄일 필요는 없고, 다른 사람이 본 것을 하나 곁에 놓아 보세요.",
    dim: "이 일의 사실이 아직 충분히 안 보여요. 가려져서가 아니라 아직 덜 모인 걸 수도 있습니다.",
    spin: "계속 들여다보고 따지는데 보인 것이 행동으로 이어지지 않아요. 보는 일이 안전한 피난처가 되었을 수 있습니다.",
    up: "이 일의 한 장면을 ‘나쁘다, 이상하다, 당연하다’ 같은 말 없이 세 문장으로 적어 보세요.",
    loose: "내가 본 장면을 다른 사람이 봤다면 어떻게 적을지 한 문단 써 보세요.",
    start: "처음 5분은 판단 없이 눈에 보인 사실만 적어 보세요.",
    asp: [
      { name: "있는 그대로 보기",
        act: ["이 일에서 실제로 있었던 일을 내 판단 없이 순서대로 말할 수 있다.", "이 일에서 내가 아직 모르는 부분이 무엇인지 말할 수 있다."],

      { name: "생각과 사실 나누기",

  { key: "연결", nick: "잇기", tag: "생각을 이어 보기", c: "var(--c2)",

      { name: "바깥 생각 들이기",

        dom: ["이 일을 한 사람의 말이나 하나의 틀로 거의 다 설명한다.", "내 틀로 설명되지 않는 일은 대수롭지 않게 넘긴다."] }
    ] },
  { key: "중첩", nick: "가능성", tag: "여러 가능성 열어두기", c: "var(--c3)",

    loose: "가능성 중 지금 가장 마음이 가는 하나를 골라 ‘이번 주는 이게 맞다고 치고 간다’고 적어 보세요. 틀리면 바꿔도 됩니다.",
    start: "먼저 가능한 이유를 세 가지 적어 보세요.",
